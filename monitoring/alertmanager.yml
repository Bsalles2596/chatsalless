global:
  resolve_timeout: 5m

route:
  receiver: chatsalles-webhook
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: chatsalles-webhook
    webhook_configs:
      # Replace this URL with the real notification endpoint before production.
      - url: http://host.docker.internal:9999/alerts
        send_resolved: true
