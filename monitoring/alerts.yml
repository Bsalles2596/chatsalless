groups:
  - name: chatsalles-availability
    rules:
      - alert: ChatSallesApiDown
        expr: up{job="chatsalles-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ChatSalles API indisponível"
          description: "A instância {{ $labels.instance }} não responde há mais de 2 minutos."

      - alert: ChatSallesHttp5xxHigh
        expr: |
          sum(rate(chatsalles_http_requests_total{job="chatsalles-api",status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(chatsalles_http_requests_total{job="chatsalles-api"}[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Taxa de erro 5xx elevada"
          description: "Mais de 5% das requisições retornaram 5xx nos últimos 5 minutos."

      - alert: ChatSallesHttp429High
        expr: |
          sum(rate(chatsalles_http_requests_total{job="chatsalles-api",status="429"}[5m]))
            /
          clamp_min(sum(rate(chatsalles_http_requests_total{job="chatsalles-api"}[5m])), 1)
            > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de rate limit elevada"
          description: "Mais de 10% das requisições retornaram 429 nos últimos 10 minutos."

  - name: chatsalles-worker
    rules:
      - alert: ChatSallesRedisDown
        expr: redis_up{job="chatsalles-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis do ChatSalles indisponível"
          description: "O Redis Exporter não consegue alcançar o Redis há mais de 2 minutos."

      - alert: ChatSallesRedisExporterDown
        expr: up{job="chatsalles-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis Exporter indisponível"
          description: "O Prometheus não consegue coletar métricas do Redis Exporter há mais de 2 minutos."

      - alert: ChatSallesWebhookFailures
        expr: increase(chatsalles_webhook_jobs_total{status="failed"}[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Falha no worker de webhooks"
          description: "O worker registrou falhas de webhook nos últimos 10 minutos."

      - alert: ChatSallesWebhookDeadLetter
        expr: increase(chatsalles_webhook_jobs_total{status="dead_letter"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Webhook enviado para dead-letter"
          description: "Há pelo menos um webhook que esgotou as tentativas e foi para dead-letter."
